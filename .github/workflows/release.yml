name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build mtls-gw
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/mtls-gw-${{ matrix.os }}-${{ matrix.arch }}$EXT" ./cmd/mtls-gw
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/mtls-gw-cli-${{ matrix.os }}-${{ matrix.arch }}$EXT" ./cmd/mtls-gw-cli

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtls-gw-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum mtls-gw-* mtls-gw-cli-* > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## mtls-gw ${{ github.ref_name }}

            Generic mTLS gateway — device-level authentication + purpose-based routing.

            ### Download
            - `mtls-gw-<os>-<arch>` — the gateway daemon
            - `mtls-gw-cli-<os>-<arch>` — management CLI
            - `SHA256SUMS.txt` — checksums

            See [README](https://github.com/0gl20shk0sbt36/mtls-gateway#readme) for setup.
          files: dist/*
          fail_on_unmatched_files: true
