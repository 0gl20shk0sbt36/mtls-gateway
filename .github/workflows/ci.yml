name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.25"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: |
          go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"

      - name: Test
        run: go test -v -race -cover ./...

      - name: Build binaries
        run: |
          go build -o /tmp/mtls-gw ./cmd/mtls-gw
          go build -o /tmp/mtls-gw-cli ./cmd/mtls-gw-cli
          go build -o /tmp/mtls-relay ./cmd/mtls-relay

  webui-unit:
    name: WebUI unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Run unit tests
        run: npm run test:webui

  webui-e2e:
    name: WebUI E2E (playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Install chromium
        run: npx playwright-core install chromium --with-deps
      - name: Setup E2E env (gw + relay + certs)
        run: bash internal/relayweb/web/e2e/setup.sh
      - name: Run E2E tests
        run: npm run test:e2e

  windows-build:
    name: Cross-compile (windows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build windows (all cmd; includes Windows certstore + mtls-admin)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./cmd/mtls-gw
          go build ./cmd/mtls-gw-cli
          go build ./cmd/mtls-relay
          go build ./cmd/mtls-relay-cli
          go build ./cmd/mtls-admin

  windows-test:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Test (runs Windows CNG source tests)
        run: go test -v -race ./...

  android-build:
    name: Cross-compile (android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build android (all cmd; includes certsource android + permissioncheck linux path)
        # 注: GOOS=android 满足 //go:build linux(go/build 特例) → permissioncheck
        # 实际编译 access_linux.go(unix.Access 在 android 可用), 非跳过路径(实测 go list 证实)。
        env:
          GOOS: android
          GOARCH: arm64
        run: |
          go build ./...
