# ============================================================
# mtls-gw 服务端配置示例 (TOML)
# 用法: cp config.example.toml /etc/mtls-gw/config.toml
#       然后按下面的注释修改, 最后: mtls-gw -config /etc/mtls-gw/config.toml
# ============================================================

# ---- 基础 ----
bind_host = "0.0.0.0"                # 所有监听(业务/管理/发现)的绑定地址
db = "/var/lib/mtls-gw/mtls-gw.db"   # SQLite 数据库路径(证书登记 + 角色授权)

# ---- CA 与网关证书 ----
ca = "/etc/mtls-gw/ca.crt"            # CA 证书(验证客户端证书链)
ca_key = "/etc/mtls-gw/ca.key"        # CA 私钥(签发证书用; 权限 600)
server_cert = "/etc/mtls-gw/server.crt"  # 网关自身 TLS 证书
server_key = "/etc/mtls-gw/server.key"   # 网关 TLS 私钥
cert_dir = "/var/lib/mtls-gw/certs"      # 签发产物的输出目录
sock_path = "/run/mtls-gw/mtls-gw.sock"  # 本机 CLI 管理 socket(仅 Linux; Windows 用 TCP admin)

# ---- 签发证书的组织信息 ----
org = "mtls-gw"                       # 证书 O 字段
ou = "device"                         # 证书 OU 字段

# ---- 有效期(天) ----
default_days = 365                    # 普通证书默认有效期
admin_days = 30                       # 含管理角色证书的默认有效期

# ---- 安全 ----
# ⚠ 热重载范围: 管理 API 的 /admin/reload 只重载 DB 与 mappings/services;
#   admin_role / require_ip_bind / tls_min_version 等安全字段修改后需重启两个进程生效
#   (mtls-gw 与 mtls-admin), 否则新旧角色证书判定不一致(flash 审计提示的管理事故陷阱)。
require_ip_bind = true                # 证书是否必须绑定来源 IP(建议保持 true)
# 私钥权限预检(仅 Linux): ca_key/server_key/reload_key 要求 mode&0o007==0(禁 world 可读/写);
# 0640(group 可读)放行(单用户/可信组部署常见); 若要"仅属主可读"请用 0600
admin_role = "mtls-superadmin"        # ★ 内置管理角色名(别用常用名; 证书有该角色才能进管理 API;
                                      #   禁止出现在业务服务 roles 里, 否则加载报错)
tls_min_version = "1.2"               # TLS 最低版本: "1.2" 或 "1.3"
config_mode = "mutable"               # 配置模式: mutable(落盘,默认) | ephemeral(仅内存) | immutable(只读)
# ⚠ ephemeral 仅管理进程内存生效: 网关 /admin/reload 读磁盘文件, 不会感知 ephemeral 改动
#   (双进程 + gateway_reload_addr 时会产生静默分叉 — pro 深度审计提示; 双进程部署请用 mutable)
# 注: 管理 API 的配置保存会整份重写本文件(格式归一化, 注释/顺序会重排) — 手改前先备份
lang = "zh"                           # 错误消息语言: zh | en

# ---- 日志(事件型, 不记录数据内容) ----
# 未配置时用分平台默认路径: Windows=exe 目录/<组件> / Linux=~/.cache/<组件>
# 注: mtls-admin 与网关读同一 config, 为避免双进程各自滚动同一文件(rename 竞态),
#     管理进程会把日志路径强制替换为 mtls-admin 组件路径(显式配置的共享路径也会被
#     替换; 替换只影响本进程, 配置落盘时保持原始路径, 网关不受影响)
log_file = "/var/log/mtls-gw/events.log"       # 系统/配置变更/证书签发吊销事件; 空=默认分平台路径
access_log_file = "/var/log/mtls-gw/access.log" # 访问日志(大量, 单独文件): 证书/时间/通道/方法/路径/状态/字节; 空=默认分平台路径
stdout_log_file = "/var/log/mtls-gw/stdout.log" # 标准日志(认证/启动/错误等 log.Printf, 终端+文件双写); 空=默认分平台路径
log_max_size = 10                    # 单文件上限 MB
log_max_files = 5                    # 保留历史份数(滚动)

# ---- 签发密钥 ----
key_type = "rsa"                      # 签发密钥类型: rsa | ecdsa
key_bits = 2048                       # rsa: 2048/3072/4096; ecdsa: 256/384/521
pwd_length = 16                       # 自动生成 p12 密码的长度

# ---- 监听端口(双进程) ----
# 网关(mtls-gw): info_listen(/info 服务发现) + reload_listen(/admin/reload, 管理进程调用)
# 管理进程(mtls-admin): admin_listen(完整管理 API, 与网关读同一 config)
# 同机部署时 info/admin/reload 三者端口必须互不相同(除 info 与 reload 可同端口合并)
info_listen = ":9499"                 # 网关 /info 服务发现端口(匿名可访问, 返回 CA 供客户端引导; 空串=关闭)
reload_listen = ":9444"               # 网关 /admin/reload 端口(管理进程调用, 仅 admin_role 证书); 空=与 info 同端口合并
admin_listen = ":9445"                # mtls-admin 管理 API 端口(仅 admin_role 证书可连)

# ---- 管理进程专属(mtls-admin 用; mtls-gw 忽略; 管理服务拆分后) ----
# gateway_reload_addr = "100.104.135.63:9444"   # 网关 /admin/reload 地址(变更 DB/配置后自动全量热重载; 空=不自动)
# reload_cert = "/var/lib/mtls-gw/certs/gw-admin/cert.pem"  # 调网关 reload 的 admin 客户端证书
# reload_key = "/var/lib/mtls-gw/certs/gw-admin/key.pem"    # 对应私钥

# ---- 角色声明列表(必须声明所有业务角色; 内置 any/null 免声明, 仅服务可用) ----
roles = ["dsh", "vault", "staff", "family"]

# ============================================================
# 映射(通道) — 唯一实体; 判重靠 listen(重复=启动报错); id 仅助记符(也须唯一)
# ============================================================
[[mappings]]
id = "dsh-main"                       # 助记符(服务用 id 或索引引用它)
listen = ":9443"                      # 入口 :端口[/路径]; 同端口多路径按最长前缀匹配
target = "http://127.0.0.1:3080"      # 后端地址(URL 带路径=前缀替换, nginx proxy_pass 语义)
# ---- 请求头改写(示例, 默认配置不含; 供后端二级授权/独立管理模块识别证书身份) ----
# op = set|del; value 支持动态变量(认证后求值): {cert_name} {cert_serial} {cert_roles} {remote_ip}
# 安全: ① 身份头先删后设, 客户端无法伪造(后端只信网关) ② 匿名(null)路由时证书变量为空 → 不注入 ③ 默认防伪造基线(9 个转发头)始终执行
# headers = [
#   { op = "set", name = "X-Client-Cert",   value = "{cert_name}" },
#   { op = "set", name = "X-Client-Serial", value = "{cert_serial}" },
#   { op = "set", name = "X-Client-Roles",  value = "{cert_roles}" },
# ]

[[mappings]]
id = "vault-admin"
listen = ":9445/admin"
target = "http://127.0.0.1:8080/"

[[mappings]]
id = "nas-a"
listen = ":9446"
target = "http://127.0.0.1:5001"

[[mappings]]
id = "nas-b"
listen = ":9447"
target = "http://127.0.0.1:5001"

# ============================================================
# 服务注册 — 所有服务必须在这里声明
# 授权: 证书的 roles 与该服务 roles 有交集才放行; "any" = 任一已登记证书; "null" = 匿名可访问(不需要证书)
# ============================================================
[[services]]
name = "dsh"                          # 服务名(唯一; 重复=启动报错)
channels = ["dsh-main"]               # 本服务的通道(mapping id, 或索引如 0; 建议用 id)
roles = ["dsh"]                       # 允许访问本服务的证书角色

[[services]]
name = "vaultwarden"
channels = ["vault-admin"]
roles = ["vault", "staff"]           # 例: 证书角色"staff"也能访问它(用户自定义角色名随意, 别撞 admin_role)

[[services]]
name = "nas"
channels = ["nas-a", "nas-b"]         # 一个服务多个通道
roles = ["family", "dsh", "any"]        # "any" = 任一已登记证书可访问
